<!doctype html>
<html>
<head><meta charset="utf-8">
<link rel="stylesheet" href="tokens.css"><title>ProgressBar — preview</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{padding:20px;font-family:var(--font-sans);background:var(--card);color:var(--foreground);
  font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased}
.row{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:7px;align-items:flex-start}
.cap{font-size:11px;line-height:14px;color:var(--muted-foreground);font-weight:500}
svg{display:block;flex:none}

.pb{width:340px}
.hd{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:8px}
.nm{font-size:14px;font-weight:500}
.vl{font-family:var(--font-mono);font-size:13px;font-weight:500}
.sub{font-size:12px;color:var(--muted-foreground)}
.tk{height:var(--progress-height);border-radius:var(--radius-sm);background:var(--track);overflow:hidden}
.fl{height:100%;border-radius:var(--radius-sm);background:var(--primary)}
.fl.info{background:var(--info)}
.fl.warn{background:var(--warning)}
.rank{display:flex;align-items:center;gap:12px}
.rc{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;flex:none;
  border-radius:var(--radius-full);background:var(--primary-soft);color:var(--primary-strong);
  font-size:13px;font-weight:600}
</style>
<script>(function(){var t=new URLSearchParams(location.search).get("theme");document.documentElement.setAttribute("data-theme",t==="dark"?"dark":"light");})();</script>
</head>
<body>

<div class="row" style="gap:36px">
  <div class="col">
    <span class="pb">
      <span class="hd"><span class="nm">Pro</span><span class="vl">$199.96</span></span>
      <span class="tk"><span class="fl" style="display:block;width:100%%"></span></span>
    </span>
    <span class="cap">full</span>
  </div>
  <div class="col">
    <span class="pb">
      <span class="hd"><span class="nm">Starter</span><span class="vl">$39.98</span></span>
      <span class="tk"><span class="fl" style="display:block;width:20%%"></span></span>
    </span>
    <span class="cap">partial</span>
  </div>
</div>
<div class="row" style="margin-top:22px">
  <div class="col">
    <span class="rank" style="width:340px">
      <span class="rc">3</span>
      <span class="pb" style="width:300px">
        <span class="hd"><span class="nm">Free</span><span class="vl">$0.00</span></span>
        <span class="tk"><span class="fl" style="display:block;width:0%%"></span></span>
        <span class="sub" style="display:block;margin-top:5px">1 subscribers</span>
      </span>
    </span>
    <span class="cap">the Top Plans row · rank circle, bar, caption</span>
  </div>
</div>

</body>
</html>
