<!doctype html>
<html>
<head><meta charset="utf-8">
<link rel="stylesheet" href="tokens.css"><title>ButtonGhost — preview</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{padding:20px;font-family:var(--font-sans);background:var(--card);color:var(--foreground);
  font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased}
.row{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:7px;align-items:flex-start}
.cap{font-size:11px;line-height:14px;color:var(--muted-foreground);font-weight:500}
svg{display:block;flex:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:var(--control-height);
  padding:0 16px;border-radius:var(--radius-lg);font-size:14px;line-height:20px;font-weight:500;
  font-family:inherit;border:1px solid transparent;cursor:pointer;white-space:nowrap;
  transition:background-color .15s,color .15s,border-color .15s}
.btn.sm{height:var(--control-height-sm);padding:0 12px;font-size:13px;line-height:18px;gap:6px}
.btn.lg{height:var(--control-height-lg);padding:0 20px}
.btn.icon{width:var(--control-height);padding:0}
.btn.icon.sm{width:var(--control-height-sm)}
.btn[disabled]{opacity:var(--opacity-disabled);cursor:not-allowed}

.g{background:transparent;color:var(--muted-foreground)}
.g.hover{background:var(--accent);color:var(--foreground)}
.g.focus{border-color:var(--ring);box-shadow:var(--shadow-focus);color:var(--foreground)}
.g.dz:hover{color:var(--danger)}
.g.dz.hover{background:var(--danger-soft);color:var(--danger)}
.g.txt{color:var(--foreground)}
.acts{display:inline-flex;align-items:center;gap:2px;border:1px dashed var(--border);border-radius:var(--radius-lg);padding:4px}
</style>
<script>(function(){var t=new URLSearchParams(location.search).get("theme");document.documentElement.setAttribute("data-theme",t==="dark"?"dark":"light");})();</script>
</head>
<body>

<div class="row">

  <div class="col"><button class="btn g icon sm hover"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.37 2.62a1 1 0 0 1 3 3l-9.01 9.02a2 2 0 0 1-.85.5l-2.88.84a.5.5 0 0 1-.62-.62l.84-2.87a2 2 0 0 1 .5-.85z"/></svg></button><span class="cap">hover</span></div>
  <div class="col"><button class="btn g icon sm focus"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.37 2.62a1 1 0 0 1 3 3l-9.01 9.02a2 2 0 0 1-.85.5l-2.88.84a.5.5 0 0 1-.62-.62l.84-2.87a2 2 0 0 1 .5-.85z"/></svg></button><span class="cap">focus-visible</span></div>
  <div class="col"><button class="btn g icon sm" disabled><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.37 2.62a1 1 0 0 1 3 3l-9.01 9.02a2 2 0 0 1-.85.5l-2.88.84a.5.5 0 0 1-.62-.62l.84-2.87a2 2 0 0 1 .5-.85z"/></svg></button><span class="cap">disabled</span></div>
  <div class="col"><button class="btn g icon sm dz hover"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M10 11v6"/><path d="M14 11v6"/></svg></button><span class="cap">destructive hover</span></div>
</div>

      <button class="btn g icon sm"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.37 2.62a1 1 0 0 1 3 3l-9.01 9.02a2 2 0 0 1-.85.5l-2.88.84a.5.5 0 0 1-.62-.62l.84-2.87a2 2 0 0 1 .5-.85z"/></svg></button><button class="btn g icon sm dz"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M10 11v6"/><path d="M14 11v6"/></svg></button>
    </span>
    <span class="cap">the table row action cluster</span>
  </div>
  <div class="col"><button class="btn g sm txt">Cancel</button><span class="cap">text ghost</span></div>
</div>

</body>
</html>
