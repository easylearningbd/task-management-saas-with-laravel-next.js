<!doctype html>
<html>
<head><meta charset="utf-8">
<link rel="stylesheet" href="tokens.css"><title>ViewToggle — preview</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{padding:20px;font-family:var(--font-sans);background:var(--card);color:var(--foreground);
  font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased}
.row{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:7px;align-items:flex-start}
.cap{font-size:11px;line-height:14px;color:var(--muted-foreground);font-weight:500}
svg{display:block;flex:none}

.seg{display:inline-flex;align-items:center;gap:2px;padding:3px;background:var(--card);
  border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm)}
.sb{display:inline-flex;align-items:center;justify-content:center;width:34px;height:26px;
  border-radius:var(--radius-md);color:var(--muted-foreground)}
.sb.on{background:var(--primary);color:var(--primary-foreground)}
.sb.hov{background:var(--accent);color:var(--foreground)}
.sb.focus{box-shadow:var(--shadow-focus)}
.big{display:inline-flex;align-items:center;gap:4px;padding:4px;background:var(--muted);
  border-radius:var(--radius-tile)}
.bb{display:inline-flex;align-items:center;justify-content:center;height:36px;padding:0 20px;
  border-radius:var(--radius-lg);font-size:14px;font-weight:500;color:var(--muted-foreground)}
.bb.on{background:var(--card);color:var(--foreground);box-shadow:var(--shadow-sm)}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 8px;margin-left:8px;
  border-radius:var(--radius-md);background:var(--success-solid);color:#fff;font-size:11px;font-weight:500}
</style>
<script>(function(){var t=new URLSearchParams(location.search).get("theme");document.documentElement.setAttribute("data-theme",t==="dark"?"dark":"light");})();</script>
</head>
<body>
