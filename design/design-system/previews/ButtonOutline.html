<!doctype html>
<html>
<head><meta charset="utf-8">
<link rel="stylesheet" href="tokens.css"><title>ButtonOutline — preview</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{padding:20px;font-family:var(--font-sans);background:var(--card);color:var(--foreground);
  font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased}
.row{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:7px;align-items:flex-start}
.cap{font-size:11px;line-height:14px;color:var(--muted-foreground);font-weight:500}
svg{display:block;flex:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:var(--control-height);
  padding:0 16px;border-radius:var(--radius-lg);font-size:14px;line-height:20px;font-weight:500;
  font-family:inherit;border:1px solid transparent;cursor:pointer;white-space:nowrap;
  transition:background-color .15s,color .15s,border-color .15s}
.btn.sm{height:var(--control-height-sm);padding:0 12px;font-size:13px;line-height:18px;gap:6px}
.btn.lg{height:var(--control-height-lg);padding:0 20px}
.btn.icon{width:var(--control-height);padding:0}
.btn.icon.sm{width:var(--control-height-sm)}
.btn[disabled]{opacity:var(--opacity-disabled);cursor:not-allowed}

.o{background:var(--card);color:var(--foreground);border-color:var(--border);box-shadow:var(--shadow-sm)}
.o.hover{background:var(--accent)}
.o.focus{border-color:var(--ring);box-shadow:var(--shadow-focus)}
.o .mut{color:var(--muted-foreground)}
</style>
<script>(function(){var t=new URLSearchParams(location.search).get("theme");document.documentElement.setAttribute("data-theme",t==="dark"?"dark":"light");})();</script>
</head>
<body>

<div class="row">
  <div class="col"><button class="btn o sm"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg> Filters</button><span class="cap">default · 32px</span></div>
  <div class="col"><button class="btn o sm hover"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg> Filters</button><span class="cap">hover</span></div>
  <div class="col"><button class="btn o sm focus"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg> Filters</button><span class="cap">focus-visible</span></div>
  <div class="col"><button class="btn o sm" disabled><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg> Filters</button><span class="cap">disabled</span></div>
</div>
<div class="row" style="margin-top:18px">
  <div class="col"><button class="btn o">Cancel</button><span class="cap">36px · dialog</span></div>
  <div class="col"><button class="btn o"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg> Back</button><span class="cap">with icon</span></div>
  <div class="col"><button class="btn o icon sm"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg></button><span class="cap">icon only</span></div>
  <div class="col"><button class="btn o sm">10 <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button><span class="cap">trailing chevron</span></div>
</div>

</body>
</html>
