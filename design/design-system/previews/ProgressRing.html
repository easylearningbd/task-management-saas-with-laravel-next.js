<!doctype html>
<html>
<head><meta charset="utf-8">
<link rel="stylesheet" href="tokens.css"><title>ProgressRing — preview</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{padding:20px;font-family:var(--font-sans);background:var(--card);color:var(--foreground);
  font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased}
.row{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:7px;align-items:flex-start}
.cap{font-size:11px;line-height:14px;color:var(--muted-foreground);font-weight:500}
svg{display:block;flex:none}

.rg{position:relative;display:inline-flex;align-items:center;justify-content:center}
.rg .v{position:absolute;font-size:16px;font-weight:700;letter-spacing:-.01em}
.rg .u{position:absolute;margin-top:24px;font-size:10px;font-weight:500;color:var(--muted-foreground)}
.lg .v{font-size:22px}
</style>
<script>(function(){var t=new URLSearchParams(location.search).get("theme");document.documentElement.setAttribute("data-theme",t==="dark"?"dark":"light");})();</script>
</head>
<body>

<div class="row" style="gap:28px;align-items:center">
  <div class="col">
    <span class="rg">
      <svg width="72" height="72" viewBox="0 0 72 72">
        <circle cx="36" cy="36" r="32" fill="none" stroke="var(--track)" stroke-width="var(--progress-ring)"/>
        <circle cx="36" cy="36" r="32" fill="none" stroke="var(--primary)" stroke-width="var(--progress-ring)"
          stroke-linecap="round" stroke-dasharray="201" stroke-dashoffset="60" transform="rotate(-90 36 36)"/>
      </svg><span class="v">70%</span></span>
    <span class="cap">default · 72px</span>
  </div>
  <div class="col">
    <span class="rg lg">
      <svg width="96" height="96" viewBox="0 0 96 96">
        <circle cx="48" cy="48" r="43" fill="none" stroke="var(--track)" stroke-width="6"/>
        <circle cx="48" cy="48" r="43" fill="none" stroke="var(--warning)" stroke-width="6"
          stroke-linecap="round" stroke-dasharray="270" stroke-dashoffset="41" transform="rotate(-90 48 48)"/>
      </svg><span class="v">42.6</span><span class="u">GB of 50</span></span>
    <span class="cap">lg · nearing a limit</span>
  </div>
  <div class="col">
    <span class="rg">
      <svg width="72" height="72" viewBox="0 0 72 72">
        <circle cx="36" cy="36" r="32" fill="none" stroke="var(--track)" stroke-width="var(--progress-ring)"/>
        <circle cx="36" cy="36" r="32" fill="none" stroke="var(--danger)" stroke-width="var(--progress-ring)"
          stroke-linecap="round" stroke-dasharray="201" stroke-dashoffset="4" transform="rotate(-90 36 36)"/>
      </svg><span class="v">98%</span></span>
    <span class="cap">over</span>
  </div>
  <div class="col">
    <span class="rg">
      <svg width="72" height="72" viewBox="0 0 72 72">
        <circle cx="36" cy="36" r="32" fill="none" stroke="var(--track)" stroke-width="var(--progress-ring)"/>
        <circle cx="36" cy="36" r="32" fill="none" stroke="var(--primary)" stroke-width="var(--progress-ring)"
          stroke-linecap="round" stroke-dasharray="50 151" transform="rotate(-90 36 36)"
          opacity="0.9"/>
      </svg><span class="v" style="font-size:12px;color:var(--muted-foreground)">…</span></span>
    <span class="cap">indeterminate</span>
  </div>
</div>

</body>
</html>
