<!doctype html>
<html>
<head><meta charset="utf-8">
<link rel="stylesheet" href="tokens.css"><title>Tabs — preview</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{padding:20px;font-family:var(--font-sans);background:var(--card);color:var(--foreground);
  font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased}
.row{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:7px;align-items:flex-start}
.cap{font-size:11px;line-height:14px;color:var(--muted-foreground);font-weight:500}
svg{display:block;flex:none}

.tabs{display:flex;align-items:center;gap:24px;border-bottom:1px solid var(--border);padding:0 2px}
.tab{position:relative;display:inline-flex;align-items:center;gap:8px;height:42px;
  font-size:14px;font-weight:500;color:var(--muted-foreground);cursor:pointer}
.tab.on{color:var(--foreground)}
.tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;border-radius:var(--radius-sm);
  background:var(--primary)}
.tab.hov{color:var(--foreground)}
.tab.dis{opacity:var(--opacity-disabled);cursor:not-allowed}
.ct{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;
  border-radius:var(--radius-md);background:var(--muted);color:var(--muted-foreground);
  font-size:11px;font-weight:500}
.tab.on .ct{background:var(--primary-soft);color:var(--primary-strong)}
</style>
<script>(function(){var t=new URLSearchParams(location.search).get("theme");document.documentElement.setAttribute("data-theme",t==="dark"?"dark":"light");})();</script>
</head>
<body>

<div class="tabs" style="width:560px">
  <span class="tab on">All <span class="ct">14</span></span>
  <span class="tab hov">Pending <span class="ct">8</span></span>
  <span class="tab">Approved <span class="ct">4</span></span>
  <span class="tab">Rejected <span class="ct">2</span></span>
  <span class="tab dis">Archived <span class="ct">0</span></span>
</div>
<p class="cap" style="margin-top:10px">active · hover · default · disabled (empty)</p>

</body>
</html>
