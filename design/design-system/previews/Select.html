<!doctype html>
<html>
<head><meta charset="utf-8">
<link rel="stylesheet" href="tokens.css"><title>Select — preview</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{padding:20px;font-family:var(--font-sans);background:var(--card);color:var(--foreground);
  font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased}
.row{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:7px;align-items:flex-start}
.cap{font-size:11px;line-height:14px;color:var(--muted-foreground);font-weight:500}
svg{display:block;flex:none}

.f{display:flex;flex-direction:column;gap:6px;width:230px}
.lbl{font-size:14px;line-height:20px;font-weight:500}
.req{color:var(--destructive);margin-left:2px}
.ctl{display:flex;align-items:center;gap:8px;height:var(--control-height);padding:0 12px;
  white-space:nowrap;overflow:hidden;
  background:var(--card);border:1px solid var(--input);border-radius:var(--radius-lg);
  font-size:14px;line-height:20px;color:var(--foreground);transition:border-color .15s,box-shadow .15s}
.ph{color:var(--muted-foreground)}
.ctl.hover{border-color:var(--muted-foreground)}
.ctl.focus{border-color:var(--ring);box-shadow:var(--shadow-focus)}
.ctl.err{border-color:var(--destructive)}
.ctl.err.focus{box-shadow:var(--shadow-focus-danger)}
.ctl.dis{background:var(--muted);opacity:var(--opacity-disabled);cursor:not-allowed}
.help{font-size:12px;line-height:16px;font-weight:500;color:var(--muted-foreground)}
.help.bad{color:var(--danger)}
.mut{color:var(--muted-foreground);opacity:var(--opacity-muted-icon)}

.pop2{margin-top:4px;width:230px;background:var(--popover);
  border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:4px;
  display:flex;flex-direction:column}
.opt{display:flex;align-items:center;justify-content:space-between;gap:8px;height:32px;padding:0 8px;
  border-radius:var(--radius-md);font-size:14px}
.opt.on{background:var(--accent)}
.opt.sel{color:var(--primary-strong);font-weight:500}
</style>
<script>(function(){var t=new URLSearchParams(location.search).get("theme");document.documentElement.setAttribute("data-theme",t==="dark"?"dark":"light");})();</script>
</head>
<body>

<div class="row">
  <div class="f"><span class="lbl">Discount Type<span class="req">*</span></span>
    <span class="ctl"><span class="ph">Select Discount Type</span><span style="margin-left:auto" class="mut"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span></span><span class="cap">default</span></div>
  <div class="f"><span class="lbl">Status</span>
    <span class="ctl hover">All Status<span style="margin-left:auto" class="mut"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span></span><span class="cap">hover</span></div>
  <div class="f"><span class="lbl">Discount Type<span class="req">*</span></span>
    <span class="ctl dis"><span class="ph">Select Discount Type</span><span style="margin-left:auto" class="mut"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span></span><span class="cap">disabled</span></div>
</div>
<div class="row" style="margin-top:16px">
  <div class="f">
    <span class="lbl">Discount Type<span class="req">*</span></span>
    <span class="ctl focus">Percentage<span style="margin-left:auto" class="mut"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span></span>
    <span class="pop2">
      <span class="opt sel">Percentage <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
      <span class="opt on">Flat Amount</span>
      <span class="opt">Free Shipping</span>
    </span>
    <span class="cap">open · selected + hover</span>
  </div>
</div>

</body>
</html>
