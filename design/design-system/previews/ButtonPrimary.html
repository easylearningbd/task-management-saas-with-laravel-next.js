<!doctype html>
<html>
<head><meta charset="utf-8">
<link rel="stylesheet" href="tokens.css"><title>ButtonPrimary — preview</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{padding:20px;font-family:var(--font-sans);background:var(--card);color:var(--foreground);
  font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased}
.row{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:7px;align-items:flex-start}
.cap{font-size:11px;line-height:14px;color:var(--muted-foreground);font-weight:500}
svg{display:block;flex:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:var(--control-height);
  padding:0 16px;border-radius:var(--radius-lg);font-size:14px;line-height:20px;font-weight:500;
  font-family:inherit;border:1px solid transparent;cursor:pointer;white-space:nowrap;
  transition:background-color .15s,color .15s,border-color .15s}
.btn.sm{height:var(--control-height-sm);padding:0 12px;font-size:13px;line-height:18px;gap:6px}
.btn.lg{height:var(--control-height-lg);padding:0 20px}
.btn.icon{width:var(--control-height);padding:0}
.btn.icon.sm{width:var(--control-height-sm)}
.btn[disabled]{opacity:var(--opacity-disabled);cursor:not-allowed}

.p{background:var(--primary);color:var(--primary-foreground);box-shadow:var(--shadow-sm)}
.p.hover{background:var(--primary-hover)}
.p.active{background:var(--primary-active)}
.p.focus{border-color:var(--ring);box-shadow:var(--shadow-focus)}
</style>
<script>(function(){var t=new URLSearchParams(location.search).get("theme");document.documentElement.setAttribute("data-theme",t==="dark"?"dark":"light");})();</script>
</head>
<body>

<div class="row">
  <div class="col"><button class="btn p"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg> Add Company</button><span class="cap">default · 36px</span></div>
  <div class="col"><button class="btn p hover"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg> Add Company</button><span class="cap">hover</span></div>
  <div class="col"><button class="btn p active"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg> Add Company</button><span class="cap">active</span></div>
  <div class="col"><button class="btn p focus"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg> Add Company</button><span class="cap">focus-visible</span></div>
  <div class="col"><button class="btn p" disabled><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg> Add Company</button><span class="cap">disabled</span></div>
</div>
<div class="row" style="margin-top:18px">
  <div class="col"><button class="btn p sm"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg> Add Coupon</button><span class="cap">sm · 32px toolbar</span></div>
  <div class="col"><button class="btn p lg">Create Plan</button><span class="cap">lg · 40px</span></div>
  <div class="col"><button class="btn p icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button><span class="cap">icon only</span></div>
  <div class="col"><button class="btn p" style="width:150px">Save</button><span class="cap">fixed width</span></div>
</div>

</body>
</html>
