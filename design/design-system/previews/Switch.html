<!doctype html>
<html>
<head><meta charset="utf-8">
<link rel="stylesheet" href="tokens.css"><title>Switch — preview</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{padding:20px;font-family:var(--font-sans);background:var(--card);color:var(--foreground);
  font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased}
.row{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:7px;align-items:flex-start}
.cap{font-size:11px;line-height:14px;color:var(--muted-foreground);font-weight:500}
svg{display:block;flex:none}

.sw{position:relative;display:inline-block;width:44px;height:24px;border-radius:var(--radius-full);
  background:var(--track);transition:background-color .15s}
.sw i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:var(--radius-full);
  background:#ffffff;box-shadow:var(--shadow-sm);transition:left .15s}
.sw.on{background:var(--primary)}
.sw.on i{left:22px}
.sw.focus{box-shadow:var(--shadow-focus)}
.sw.dis{opacity:var(--opacity-disabled);cursor:not-allowed}
.sw.sm{width:36px;height:20px}
.sw.sm i{width:16px;height:16px}
.sw.sm.on i{left:18px}
.fr{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500}
</style>
<script>(function(){var t=new URLSearchParams(location.search).get("theme");document.documentElement.setAttribute("data-theme",t==="dark"?"dark":"light");})();</script>
</head>
<body>

<div class="row" style="gap:26px">
  <div class="col"><span class="sw"><i></i></span><span class="cap">off</span></div>
  <div class="col"><span class="sw on"><i></i></span><span class="cap">on</span></div>
  <div class="col"><span class="sw on focus"><i></i></span><span class="cap">focus-visible</span></div>
  <div class="col"><span class="sw dis"><i></i></span><span class="cap">disabled off</span></div>
  <div class="col"><span class="sw on dis"><i></i></span><span class="cap">disabled on</span></div>
  <div class="col"><span class="sw sm on"><i></i></span><span class="cap">sm · 36x20</span></div>
</div>
<div class="row" style="margin-top:20px;gap:32px">
  <div class="col"><span class="fr">Enable Login <span class="sw"><i></i></span></span><span class="cap">label leading · form</span></div>
  <div class="col"><span class="fr"><span style="width:150px">AI Integration</span><span class="sw on"><i></i></span></span><span class="cap">label + right-aligned · settings row</span></div>
</div>

</body>
</html>
