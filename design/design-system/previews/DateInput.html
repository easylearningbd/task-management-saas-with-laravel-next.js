<!doctype html>
<html>
<head><meta charset="utf-8">
<link rel="stylesheet" href="tokens.css"><title>DateInput — preview</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{padding:20px;font-family:var(--font-sans);background:var(--card);color:var(--foreground);
  font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased}
.row{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:7px;align-items:flex-start}
.cap{font-size:11px;line-height:14px;color:var(--muted-foreground);font-weight:500}
svg{display:block;flex:none}

.f{display:flex;flex-direction:column;gap:6px;width:230px}
.lbl{font-size:14px;line-height:20px;font-weight:500}
.req{color:var(--destructive);margin-left:2px}
.ctl{display:flex;align-items:center;gap:8px;height:var(--control-height);padding:0 12px;
  white-space:nowrap;overflow:hidden;
  background:var(--card);border:1px solid var(--input);border-radius:var(--radius-lg);
  font-size:14px;line-height:20px;color:var(--foreground);transition:border-color .15s,box-shadow .15s}
.ph{color:var(--muted-foreground)}
.ctl.hover{border-color:var(--muted-foreground)}
.ctl.focus{border-color:var(--ring);box-shadow:var(--shadow-focus)}
.ctl.err{border-color:var(--destructive)}
.ctl.err.focus{box-shadow:var(--shadow-focus-danger)}
.ctl.dis{background:var(--muted);opacity:var(--opacity-disabled);cursor:not-allowed}
.help{font-size:12px;line-height:16px;font-weight:500;color:var(--muted-foreground)}
.help.bad{color:var(--danger)}
.mut{color:var(--muted-foreground);opacity:var(--opacity-muted-icon)}
</style>
<script>(function(){var t=new URLSearchParams(location.search).get("theme");document.documentElement.setAttribute("data-theme",t==="dark"?"dark":"light");})();</script>
</head>
<body>

<div class="row">
  <div class="f"><span class="lbl">Expiry Date</span>
    <span class="ctl"><span class="ph">mm/dd/yyyy</span><span style="margin-left:auto" class="mut"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg></span></span><span class="cap">empty</span></div>
  <div class="f"><span class="lbl">Expiry Date</span>
    <span class="ctl focus">10/14/2026<span style="margin-left:auto" class="mut"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg></span></span><span class="cap">focus + value</span></div>
  <div class="f"><span class="lbl">Created After</span>
    <span class="ctl hover"><span class="mut" style="margin-right:2px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg></span><span class="ph">mm/dd/yyyy</span></span><span class="cap">leading icon · filter bar</span></div>
</div>

</body>
</html>
